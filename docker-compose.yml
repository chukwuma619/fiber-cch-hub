services:
  fiber:
    image: ${FIBER_IMAGE:-nervos/fiber:0.9.0}
    container_name: fiber-cch-hub-fiber
    restart: unless-stopped
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:?set FIBER_SECRET_KEY_PASSWORD in .env}
      FIBER_CONFIG: /fiber/config.yml
      RUST_LOG: ${RUST_LOG:-info,fnn=info}
    volumes:
      - ./data/fiber:/fiber
    ports:
      - "${FIBER_P2P_PORT:-8228}:8228"
      - "${FIBER_RPC_PORT:-8227}:8227"
    networks:
      hub:
        ipv4_address: 172.30.0.10
    healthcheck:
      test:
        [
          "CMD",
          "fnn-cli",
          "--url",
          "http://172.30.0.10:8227",
          "info",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Bitcoin testnet LND (Neutrino) — matches Fiber/CCH currency Fibt.
  lnd:
    image: ${LND_IMAGE:-lightninglabs/lnd:v0.18.5-beta}
    container_name: fiber-cch-hub-lnd
    restart: unless-stopped
    volumes:
      - ./data/lnd:/root/.lnd
    command:
      - --lnddir=/root/.lnd
      - --bitcoin.active
      - --bitcoin.testnet
      - --bitcoin.node=neutrino
      - --neutrino.connect=159.203.125.125:18333
      - --neutrino.addpeer=lnd.bitrefill.com:18333
      - --neutrino.addpeer=btcd-testnet.lightning.computer
      - --feeurl=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --noseedbackup
      - --accept-keysend
      - --protocol.wumbo-channels
    ports:
      - "${LND_RPC_PORT:-10009}:10009"
      - "${LND_P2P_PORT:-9735}:9735"
    networks:
      hub:
        ipv4_address: 172.30.0.30

  cch:
    image: ${FIBER_IMAGE:-nervos/fiber:0.9.0}
    container_name: fiber-cch-hub-cch
    restart: unless-stopped
    depends_on:
      fiber:
        condition: service_healthy
      lnd:
        condition: service_started
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:?set FIBER_SECRET_KEY_PASSWORD in .env}
      FIBER_CONFIG: /fiber/config.yml
      RUST_LOG: ${RUST_LOG:-info,fnn=info,fnn::cch=debug}
    volumes:
      - ./data/cch:/fiber
    ports:
      - "${CCH_RPC_PORT:-8327}:8227"
    networks:
      hub:
        ipv4_address: 172.30.0.20

networks:
  hub:
    name: fiber-cch-hub
    ipam:
      config:
        - subnet: 172.30.0.0/24
