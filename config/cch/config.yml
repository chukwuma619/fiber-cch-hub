# Standalone Cross-Chain Hub
#
# fiber.chain (not in services) → disabled_fiber → CCH currency Fibt
# (matches Fiber testnet). Swap invoices must be Bitcoin testnet bolt11.
#
# https://www.fiber.world/docs/api-reference/cross-chain/cch
# https://www.fiber.world/docs/res/cross-chain-htlc#standalone-mode

fiber:
  chain: testnet
  listening_addr: "/ip4/127.0.0.1/tcp/8228"

rpc:
  listening_addr: "172.30.0.20:8227"
  enabled_modules:
    - cch

cch:
  fiber_rpc_url: "http://172.30.0.10:8227"

  lnd_rpc_url: "https://172.30.0.30:10009"
  lnd_cert_path: "/fiber/lnd/tls.cert"
  lnd_macaroon_path: "/fiber/lnd/admin.macaroon"

  # https://faucet-cwbtc.ckb.dev/guide.html
  wrapped_btc_type_script: '{"code_hash":"0x25c29dc317811a6f6f3985a7a9ebc4838bd388d19d0feeecf0bcd60f6c0975bb","hash_type":"type","args":"0x9a1086531ed6dc69e0bd44cef5278e03faf3015b31aff60b08fb87663ce8507100000000"}'

  base_fee_sats: 100
  fee_rate_per_million_sats: 3000
  order_expiry_delta_seconds: 129600
  btc_final_tlc_expiry_delta_blocks: 360
  ckb_final_tlc_expiry_delta_seconds: 216000
  min_outgoing_invoice_expiry_delta_seconds: 21600

  ignore_startup_failure: false

services:
  - rpc
  - cch
